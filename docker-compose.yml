# Runs the whole stack with one command: `docker compose up`
# Postgres, the API and the frontend all start together. Nothing needs to be
# installed on the host except Docker itself.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: feedback_collector
    ports:
      # Exposed so you can point pgAdmin or Prisma Studio at it if you want
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this, otherwise migrations race the database startup
      test: ["CMD-SHELL", "pg_isready -U postgres -d feedback_collector"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/feedback_collector?schema=public
      PORT: 5000
      # Local-only throwaway values. Anything deployed publicly needs real secrets.
      JWT_SECRET: docker-local-dev-secret-not-for-production
      ADMIN_SIGNUP_CODE: let-me-in
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      # Resolved by the browser, so it is localhost rather than the service name
      REACT_APP_API_URL: http://localhost:5000/api
      # Needed for hot reload to see file changes through a bind mount
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  dbdata:
